name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libx11-6 libexpat1
          pip install -r requirements.txt pytest python-fcl httpx
      - name: Tests (sin LibreDWG el test de DWG se omite)
        run: pytest -q
